<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raito Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#313338;color:#dbdee1;height:100vh;display:flex;overflow:hidden}
button,input{font:inherit}.hidden{display:none!important}
.login{width:100%;display:grid;place-items:center;background:#1e1f22}.card{width:min(420px,92%);background:#2b2d31;padding:30px;border-radius:10px;box-shadow:0 10px 35px #0008}.card h1{margin:0 0 8px;color:#fff}.card p{color:#949ba4}.card input{width:100%;background:#1e1f22;border:0;border-radius:6px;padding:13px;color:#fff;margin:8px 0 14px}.primary{width:100%;border:0;border-radius:6px;padding:12px;background:#5865f2;color:#fff;font-weight:bold;cursor:pointer}
.sidebar{width:260px;background:#2b2d31;display:flex;flex-direction:column}.brand{padding:18px;font-weight:bold;border-bottom:1px solid #202125}.section{padding:14px 14px 5px;color:#949ba4;font-size:11px;font-weight:bold}.room{padding:10px 14px;margin:3px 8px;border-radius:5px;cursor:pointer;color:#b5bac1}.room.active,.room:hover{background:#404249;color:#fff}.bottom{margin-top:auto;background:#232428;padding:12px;display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:#5865f2;display:grid;place-items:center;color:#fff;font-weight:bold}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:60px;padding:0 18px;border-bottom:1px solid #202125;display:flex;align-items:center;font-weight:bold}.top small{color:#949ba4;margin-left:12px}.chat{flex:1;overflow:auto;padding:20px}.msg{display:flex;gap:11px;margin:16px 0}.msg .avatar{flex:none}.who{font-weight:bold;color:#fff}.time{font-size:11px;color:#949ba4;margin-left:8px}.msg p{margin:4px 0;white-space:pre-wrap;word-break:break-word}.composer{display:flex;gap:10px;padding:0 18px 18px}.composer input{flex:1;background:#383a40;border:0;border-radius:8px;padding:14px;color:#fff;outline:0}.composer button{background:#5865f2;color:#fff;border:0;border-radius:8px;padding:0 20px;font-weight:bold}.members{width:210px;background:#2b2d31;padding:18px 12px}.member{padding:8px;display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#23a559}.owner{color:#faa61a;font-size:10px;margin-left:auto}.tools{margin-left:auto;display:flex;gap:7px}.tools button{background:#404249;color:#fff;border:0;border-radius:5px;padding:7px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.modalbox{width:min(430px,92%);background:#2b2d31;border-radius:8px;padding:24px}.modalbox input,.modalbox select{width:100%;padding:11px;margin:7px 0 13px;background:#1e1f22;color:#fff;border:0;border-radius:5px}.modalbox button{padding:10px 14px;border:0;border-radius:5px;background:#5865f2;color:#fff}
@media(max-width:850px){.members{display:none}}@media(max-width:600px){.sidebar{width:190px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><h1>Raito Chat</h1><p>Create your profile. Your name will be saved.</p><input id="nameInput" maxlength="24" placeholder="Your name"><button id="startBtn" class="primary">Create account</button><p id="loginError"></p></div></div>

<div id="app" class="hidden" style="width:100%;display:flex">
<aside class="sidebar"><div class="brand">Raito Chat</div><div class="section">ROOMS</div><div id="rooms"></div><button id="newRoom" class="primary" style="margin:12px;width:calc(100% - 24px)">+ Create room</button><div class="bottom"><div id="myAvatar" class="avatar">P</div><div style="min-width:0"><b id="myName">Punler</b><div style="font-size:11px;color:#949ba4">Online</div></div><button id="profileBtn" style="margin-left:auto;background:none;border:0;color:#bbb;cursor:pointer">⚙</button></div></aside>
<main class="main"><div class="top"><span id="roomTitle"># general</span><small id="roomInfo"></small><div class="tools"><button id="clearBtn">Clear chat</button><button id="deleteBtn">Delete room</button></div></div><div id="chat" class="chat"></div><form id="form" class="composer"><input id="message" placeholder="Message this room" autocomplete="off"><button>Send</button></form></main>
<aside class="members"><div class="section">MEMBERS</div><div id="members"></div></aside></div>

<div id="modal" class="modal hidden"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="modalOk">Save</button> <button id="modalCancel" style="background:#404249">Cancel</button></div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getFirestore,collection,doc,setDoc,addDoc,getDoc,deleteDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp,where,getDocs,writeBatch}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyB9u5FmFrQoDWW8lE6u9b_p5SZQicrMLp0",authDomain:"discord-punler.firebaseapp.com",projectId:"discord-punler",storageBucket:"discord-punler.firebasestorage.app",messagingSenderId:"209745567966",appId:"1:209745567966:web:3aa3606ac7418ac7fb624f"};
const app=initializeApp(cfg),db=getFirestore(app);
let me=localStorage.getItem("raito_uid"),myName=localStorage.getItem("raito_name"),roomId=localStorage.getItem("raito_room")||null,unsubs=[];
const $=id=>document.getElementById(id); const esc=s=>s;
function openModal(title,body,fn){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.remove("hidden");$("modalOk").onclick=async()=>{await fn();$("modal").classList.add("hidden")};$("modalCancel").onclick=()=>$("modal").classList.add("hidden")}
async function init(){
 if(!me||!myName){$("login").classList.remove("hidden");return}
 $("login").classList.add("hidden");$("app").classList.remove("hidden");$("myName").textContent=myName;$("myAvatar").textContent=myName[0].toUpperCase();
 onSnapshot(collection(db,"rooms"),s=>{let arr=[];s.forEach(d=>arr.push({id:d.id,...d.data()}));if(!arr.length)createRoom("general",10);else{renderRooms(arr);if(!roomId||!arr.some(r=>r.id===roomId))selectRoom(arr[0].id)}})
}
function renderRooms(arr){$("rooms").innerHTML="";arr.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)).forEach(r=>{let x=document.createElement("div");x.className="room"+(r.id===roomId?" active":"");x.textContent="# "+r.name;x.onclick=()=>selectRoom(r.id);$("rooms").append(x)})}
async function createRoom(name,limit=10){let r=await addDoc(collection(db,"rooms"),{name,limit:Number(limit),ownerId:me,ownerName:myName,createdAt:serverTimestamp()});await setDoc(doc(db,"rooms",r.id,"members",me),{name:myName,joinedAt:serverTimestamp(),role:"owner"});selectRoom(r.id)}
async function selectRoom(id){roomId=id;localStorage.setItem("raito_room",id);unsubs.forEach(f=>f());unsubs=[];let rd=await getDoc(doc(db,"rooms",id));if(!rd.exists())return;let r=rd.data();$("roomTitle").textContent="# "+r.name;$("roomInfo").textContent="limit "+r.limit;const mq=query(collection(db,"rooms",id,"messages"),orderBy("createdAt","asc"));unsubs.push(onSnapshot(mq,s=>{ $("chat").innerHTML="";s.forEach(d=>addMessage(d.data()));$("chat").scrollTop=$("chat").scrollHeight}));const uq=collection(db,"rooms",id,"members");unsubs.push(onSnapshot(uq,s=>{ $("members").innerHTML="";s.forEach(d=>{let m=d.data();let x=document.createElement("div");x.className="member";x.innerHTML='<span class="dot"></span><span></span>';x.querySelector("span:nth-child(2)").textContent=m.name+(m.role==="owner"?" 👑":"");if(m.role!=="owner"&&r.ownerId===me){let b=document.createElement("button");b.textContent="Kick";b.style.cssText="margin-left:auto;background:#ed4245;color:white;border:0;border-radius:4px;padding:4px 6px";b.onclick=()=>kick(d.id);x.append(b)}$("members").append(x)})}));$("deleteBtn").style.display=r.ownerId===me?"block":"none";$("clearBtn").style.display=r.ownerId===me?"block":"none";let mem=await getDocs(uq);if(!mem.docs.some(d=>d.id===me)){if(mem.size<Number(r.limit))await setDoc(doc(db,"rooms",id,"members",me),{name:myName,joinedAt:serverTimestamp(),role:"member"});else $("roomInfo").textContent+=" • Full"}}
function addMessage(m){let x=document.createElement("div");x.className="msg";x.innerHTML='<div class="avatar"></div><div><span class="who"></span><span class="time">now</span><p></p></div>';x.querySelector(".avatar").textContent=(m.name||"?")[0].toUpperCase();x.querySelector(".who").textContent=m.name||"Unknown";x.querySelector("p").textContent=m.text||"";$("chat").append(x)}
$("form").onsubmit=async e=>{e.preventDefault();let t=$("message").value.trim();if(!t||!roomId)return;let r=await getDoc(doc(db,"rooms",roomId));if(!r.exists())return;let mem=await getDoc(doc(db,"rooms",roomId,"members",me));if(!mem.exists()){alert("You are not in this room.");return}await addDoc(collection(db,"rooms",roomId,"messages"),{name:myName,userId:me,text:t,createdAt:serverTimestamp()});$("message").value=""};
$("startBtn").onclick=async()=>{let n=$("nameInput").value.trim();if(!n)return $("loginError").textContent="Enter a name";myName=n;me=crypto.randomUUID();localStorage.setItem("raito_uid",me);localStorage.setItem("raito_name",myName);await setDoc(doc(db,"users",me),{name:myName,createdAt:serverTimestamp()});init()};
$("newRoom").onclick=()=>openModal("Create room",'<input id="rn" placeholder="Room name"><label>Player limit</label><input id="rl" type="number" min="2" max="100" value="10">',async()=>{let n=$("rn").value.trim()||"new-room";let l=Math.max(2,Math.min(100,Number($("rl").value)||10));await createRoom(n,l)});
$("profileBtn").onclick=()=>openModal("Edit profile",'<input id="pn" value="'+myName.replace(/"/g,"&quot;")+'" maxlength="24">',async()=>{let n=$("pn").value.trim();if(n){myName=n;localStorage.setItem("raito_name",n);$("myName").textContent=n;await updateDoc(doc(db,"users",me),{name:n})}});
$("clearBtn").onclick=async()=>{if(!confirm("Delete all messages in this room?"))return;let s=await getDocs(collection(db,"rooms",roomId,"messages"));let b=writeBatch(db);s.forEach(d=>b.delete(d.ref));await b.commit()};
$("deleteBtn").onclick=async()=>{if(!confirm("Delete this room?"))return;let s=await getDocs(collection(db,"rooms",roomId,"members"));let b=writeBatch(db);s.forEach(d=>b.delete(d.ref));let ms=await getDocs(collection(db,"rooms",roomId,"messages"));ms.forEach(d=>b.delete(d.ref));b.delete(doc(db,"rooms",roomId));await b.commit();roomId=null;localStorage.removeItem("raito_room")};
async function kick(uid){await deleteDoc(doc(db,"rooms",roomId,"members",uid))}
init();
</script></body></html>
